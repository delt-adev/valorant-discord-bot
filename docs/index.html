
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VALORANT match notification dashboard">
  <title>VALORANT Match Notifier</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="shell">

    <header class="topbar">
      <a class="brand" href="./">VALORANT <span>TRACKER</span></a>
      <span class="status"><i></i> PROTOTYPE</span>
    </header>

    <section class="hero">
      <p class="eyebrow">MATCH NOTIFICATION SYSTEM</p>

      <h1>
        내 경기 기록을<br>
        <span>Discord로 받아보세요.</span>
      </h1>

      <p class="intro">
        VALORANT 계정을 등록하고 새로운 경기 결과를
        Discord로 받아보는 서비스입니다.
      </p>

      <button id="login" disabled>
        Riot 공식 로그인 (승인 대기 중)
      </button>

      <p class="notice" id="notice">
        백엔드 연결 확인 중...
      </p>
    </section>

    <section class="panel">

      <div class="panel-head">
        <div>
          <p class="eyebrow">DASHBOARD</p>
          <h2>계정 관리</h2>
        </div>

        <span class="tag">TEST MODE</span>
      </div>

      <form id="account-form" class="account-form">

        <div class="input-group">
          <label for="game-name">Riot ID</label>
          <input
            id="game-name"
            type="text"
            placeholder="GameName"
            maxlength="32"
            required
          >
        </div>

        <span class="tag-separator">#</span>

        <div class="input-group tag-input">
          <label for="tag-line">태그</label>
          <input
            id="tag-line"
            type="text"
            placeholder="KR1"
            maxlength="16"
            required
          >
        </div>

        <div class="input-group region-input">
          <label for="region">지역</label>
          <select id="region">
            <option value="ap">Asia Pacific</option>
            <option value="na">North America</option>
            <option value="eu">Europe</option>
            <option value="kr">Korea</option>
          </select>
        </div>

        <button type="submit" class="add-button">
          계정 등록
        </button>

      </form>

      <div class="account-section">
        <h3>등록된 계정</h3>
        <div id="account-list">
          <p class="account-empty">계정 목록을 불러오는 중...</p>
        </div>
      </div>

    </section>

    <footer>
      Unofficial community project. Not affiliated with Riot Games.
    </footer>

  </main>

  <script src="./config.js"></script>
  <script src="./app.js"></script>

</body>
</html>
